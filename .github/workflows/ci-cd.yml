name: Ecommerce CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  quality:
    name: Build, Test and SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      # Test whether GitHub Actions can reach SonarQube
      - name: Test SonarQube connectivity
        run: |
          echo "Testing SonarQube..."
          curl -4 -v --connect-timeout 30 "${{ secrets.SONAR_HOST_URL }}/api/system/status"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


  docker:
    name: Build, Scan and Push Docker Images
    needs: quality

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg REACT_APP_BACKEND_URL=http://${{ secrets.EC2_HOST }}:5000 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:${{ steps.meta.outputs.tag }} \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:${{ steps.meta.outputs.tag }} \
            ./backend

      # Scan frontend Docker image for HIGH and CRITICAL vulnerabilities
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Scan backend Docker image for HIGH and CRITICAL vulnerabilities
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Push frontend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:${{ steps.meta.outputs.tag }}

      - name: Push backend image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:${{ steps.meta.outputs.tag }}


  deploy:
    name: Deploy to EC2
    needs: docker

    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/e-commerce

            echo "Pulling latest source code..."
            git pull origin main

            echo "Creating deployment environment..."

            echo "FRONTEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-frontend:${{ needs.docker.outputs.image_tag }}" > .env
            echo "BACKEND_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-backend:${{ needs.docker.outputs.image_tag }}" >> .env
            echo "FRONTEND_URL=http://${{ secrets.EC2_HOST }}:3000" >> .env
            echo "BACKEND_URL=http://${{ secrets.EC2_HOST }}:5000" >> .env
            echo "MONGO_DATABASE=ecommerce" >> .env
            echo "FRONTEND_PORT=3000" >> .env
            echo "BACKEND_PORT=5000" >> .env
            echo "MONGO_PORT=27017" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env

            echo "Pulling Docker images..."
            docker compose pull

            echo "Starting application..."
            docker compose up -d --no-build

            echo "Checking containers..."
            docker compose ps

            echo "Deployment completed successfully!"